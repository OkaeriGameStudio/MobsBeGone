name: Build and Release

on:
  push:
    branches:
      - main
    paths:
      - gradle.properties

  # Useful for publishing the current version once after installing this workflow.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check version change
        id: version
        shell: bash
        run: |
          NEW_VERSION="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r[:space:]')"

          if [[ ! "$NEW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid mod_version: '$NEW_VERSION'"
            exit 1
          fi

          SHOULD_PUBLISH=true

          if [[ "${{ github.event_name }}" == "push" ]]; then
            OLD_VERSION="$(
              git show "${{ github.event.before }}:gradle.properties" 2>/dev/null |
              sed -n 's/^mod_version=//p' |
              tr -d '\r[:space:]'
            )"

            if [[ "$NEW_VERSION" == "$OLD_VERSION" ]]; then
              SHOULD_PUBLISH=false
              echo "gradle.properties changed, but mod_version did not."
            fi
          fi

          echo "value=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "publish=$SHOULD_PUBLISH" >> "$GITHUB_OUTPUT"

      - name: Set up Java 21
        if: steps.version.outputs.publish == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        if: steps.version.outputs.publish == 'true'
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle executable
        if: steps.version.outputs.publish == 'true'
        run: chmod +x gradlew

      - name: Build
        if: steps.version.outputs.publish == 'true'
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: Generate changelog
        if: steps.version.outputs.publish == 'true'
        shell: bash
        run: |
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"

          if [[ -n "$PREVIOUS_TAG" ]]; then
            git log "$PREVIOUS_TAG..HEAD" \
              --pretty=format:'- %s (`%h`)' > RELEASE_NOTES.md
          else
            git log \
              --pretty=format:'- %s (`%h`)' > RELEASE_NOTES.md
          fi

          if [[ ! -s RELEASE_NOTES.md ]]; then
            echo "- MobsBeGone ${{ steps.version.outputs.value }}" \
              > RELEASE_NOTES.md
          fi

      - name: Publish everywhere
        if: steps.version.outputs.publish == 'true'
        uses: Kira-NT/mc-publish@v3
        with:
          files: build/libs/MobsBeGone-${{ steps.version.outputs.value }}.jar

          name: MobsBeGone ${{ steps.version.outputs.value }}
          version: ${{ steps.version.outputs.value }}
          version-type: release
          changelog-file: RELEASE_NOTES.md

          loaders: fabric
          game-versions: 1.21.1
          game-version-filter: none
          environment: server | singleplayer
          java: 21

          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}

          modrinth-id: hXvXSxxg
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: 1302442
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          github-tag: v${{ steps.version.outputs.value }}
          github-commitish: ${{ github.sha }}
          github-generate-changelog: false
          github-token: ${{ secrets.GITHUB_TOKEN }}

          retry-attempts: 3
          retry-delay: 10000
          fail-mode: fail
