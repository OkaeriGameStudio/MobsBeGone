name: Release

on:
  push:
    branches:
      - main
    paths:
      - gradle.properties

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Read mod version
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r[:space:]')"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid mod_version: '$VERSION'"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether release exists
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; nothing to publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.release.outputs.exists == 'false'
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: Find release JAR
        if: steps.release.outputs.exists == 'false'
        id: jar
        shell: bash
        run: |
          mapfile -t JARS < <(
            find build/libs \
              -maxdepth 1 \
              -type f \
              -name "*.jar" \
              ! -name "*-sources.jar" \
              ! -name "*-dev.jar"
          )

          if [[ "${#JARS[@]}" -ne 1 ]]; then
            echo "Expected exactly one release JAR, found ${#JARS[@]}:"
            printf '%s\n' "${JARS[@]}"
            exit 1
          fi

          echo "path=${JARS[0]}" >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub release
        if: steps.release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          JAR: ${{ steps.jar.outputs.path }}
        run: |
          gh release create "$TAG" "$JAR" \
            --target "$GITHUB_SHA" \
            --title "MobsBeGone $VERSION" \
            --generate-notes
