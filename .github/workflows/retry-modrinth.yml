name: Retry Modrinth Upload

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon --stacktrace

      - name: Publish only to Modrinth
        uses: Kira-NT/mc-publish@v3
        with:
          files: build/libs/MobsBeGone-0.0.9.jar

          name: MobsBeGone 0.0.9
          version: 0.0.9
          version-type: release
          changelog: |
            Fixed compatibility with Cobblemon Combee beehive behaviour.

          loaders: fabric
          game-versions: 1.21.1
          game-version-filter: none
          environment: server | singleplayer
          java: 21

          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}

          modrinth-id: hXvXSxxg
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          retry-attempts: 3
          retry-delay: 10000
          fail-mode: fail
